# 버전의 근거와 확인 방법: specs/001-place-order/research.md 0절
# Spring Boot BOM이 관리하는 라이브러리(Flyway, Oracle JDBC, Testcontainers, JUnit, AssertJ, OpenTelemetry SDK)는 버전을 적지 않는다.
# P2·P3 단계에서 쓰는 Resilience4j와 WireMock은 그 단계에서 더한다.

[versions]
spring-boot = "4.1.1"
mybatis-spring-boot = "4.1.0"
opentelemetry-logback-appender = "2.28.1-alpha"
archunit = "1.5.1"
swagger-request-validator = "2.46.1"
spotless = "8.10.3"
palantir-java-format = "2.101.0"
spotbugs-plugin = "6.5.12"
spotbugs = "4.10.4"

[libraries]
spring-boot-dependencies = { module = "org.springframework.boot:spring-boot-dependencies", version.ref = "spring-boot" }
spring-boot-gradle-plugin = { module = "org.springframework.boot:spring-boot-gradle-plugin", version.ref = "spring-boot" }
spotless-gradle-plugin = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
spotbugs-gradle-plugin = { module = "com.github.spotbugs.snom:spotbugs-gradle-plugin", version.ref = "spotbugs-plugin" }
mybatis-spring-boot-starter = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter", version.ref = "mybatis-spring-boot" }
mybatis-spring-boot-starter-test = { module = "org.mybatis.spring.boot:mybatis-spring-boot-starter-test", version.ref = "mybatis-spring-boot" }
opentelemetry-logback-appender = { module = "io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0", version.ref = "opentelemetry-logback-appender" }
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
swagger-request-validator-core = { module = "com.atlassian.oai:swagger-request-validator-core", version.ref = "swagger-request-validator" }
