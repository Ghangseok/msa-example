openapi: 3.0.3
info:
  title: Order Service API (주문 조회)
  version: 1.0.0
  description: |
    고객과 관리자가 부르는 주문 서비스의 외부 API 가운데 주문 조회 부분이다. 주문 생성 부분은 specs/001-place-order/contracts/order-api.yaml에 있다.

    - 로그인한 사용자만 부른다. 주문 서비스가 JWT를 직접 검증하고, 고객은 토큰의 sub로만 구별한다. 쿼리 매개변수나 헤더로 받은 고객 ID는 쓰지 않는다.
    - 고객 조회(GET /orders, GET /orders/{orderNo})는 로그인한 고객 본인의 주문만 돌려준다. 다른 고객의 주문 번호, 없는 주문 번호, 숫자가 아닌 주문 번호는 모두 같은 404(ORDER_NOT_FOUND)다.
    - 관리자 조회(GET /admin/orders)는 ADMIN 역할만 부를 수 있다. 응답에 재고 해제 결과(releaseStatus)가 함께 나온다.
    - 이 기능은 읽기만 한다. 주문을 바꾸지 않는다.
    - 이 파일은 이 기능이 더한 부분만 담는다. 서비스 사이 API가 아니라서 저장소 루트 contracts/에 두지 않는다.
    - Problem과 FieldError 스키마는 specs/001-place-order/contracts/order-api.yaml의 것을 이 파일에 다시 적었다. 오류 종류(code)는 값 목록으로 묶지 않으므로 값을 더해도 기존 값은 바뀌지 않는다.
servers:
  - url: http://localhost
    description: 로컬 Gateway (티켓 003). 서비스 통합 테스트는 앱을 직접 부른다
paths:
  /orders:
    get:
      operationId: listMyOrders
      summary: 로그인한 고객 자기 주문의 목록을 조회한다
      description: 주문 번호가 큰 순서(최근 주문이 먼저)로 돌려준다. 주문이 없으면 빈 목록이다. 관리자 역할만 있는 사용자도 자기 주문만 본다.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 자기 주문의 한 쪽. 주문이 하나도 없으면 orders가 빈 배열이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderPage'
        '400':
          description: page나 size가 규칙에 맞지 않음(code = INVALID_QUERY_PARAMETER)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 토큰이 없거나 검증에 실패함(code = UNAUTHORIZED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /orders/{orderNo}:
    get:
      operationId: getMyOrder
      summary: 로그인한 고객 자기 주문 하나를 조회한다
      description: 다른 고객의 주문 번호로 조회하면 그 주문이 있는지도 알 수 없게 404를 돌려준다. 없는 주문 번호와 숫자가 아닌 주문 번호도 같은 404다.
      security:
        - bearerAuth: []
      parameters:
        - name: orderNo
          in: path
          required: true
          description: 주문 번호. 숫자가 아니어도 400이 아니라 404다
          schema:
            type: string
      responses:
        '200':
          description: 자기 주문 하나
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderDetail'
        '401':
          description: 토큰이 없거나 검증에 실패함(code = UNAUTHORIZED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '404':
          description: 다른 고객의 주문, 없는 주문, 숫자가 아닌 주문 번호(code = ORDER_NOT_FOUND). 세 경우의 응답은 상태 코드, type, title, detail, code가 모두 같다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
  /admin/orders:
    get:
      operationId: searchOrdersAsAdmin
      summary: 관리자가 모든 고객의 주문을 상태와 재고 해제 결과로 조회한다
      description: |
        status와 releaseStatus는 생략할 수 있다. 둘 다 주면 둘 다 맞는 주문만 나온다. 주문 번호가 큰 순서로 돌려준다.
        해제 결과가 비어 있는 주문은 releaseStatus가 null로 나온다. 해제 결과가 빈 "실패" 주문을 찾으려면 status=FAILED로 조회하고 releaseStatus가 null인 주문을 읽는다.
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          description: 주문 상태. 대소문자를 구분한다. 없는 이름이나 빈 값은 400이다
          schema:
            type: string
            enum: [PENDING, CONFIRMED, REJECTED, FAILED]
        - name: releaseStatus
          in: query
          required: false
          description: 재고 해제 결과. 대소문자를 구분한다. 없는 값이나 빈 값은 400이다
          schema:
            type: string
            enum: [NOT_REQUIRED, RELEASED, RELEASE_FAILED]
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 조건에 맞는 주문의 한 쪽. 조건에 맞는 주문이 없으면 orders가 빈 배열이다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminOrderPage'
        '400':
          description: 없는 상태 이름, 없는 해제 결과 값, 또는 규칙에 맞지 않는 page나 size(code = INVALID_QUERY_PARAMETER)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 토큰이 없거나 검증에 실패함(code = UNAUTHORIZED)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '403':
          description: 로그인은 했지만 ADMIN 역할이 없음(code = FORBIDDEN)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      required: false
      description: 쪽 번호. 0부터 시작한다. 없으면 0
      schema:
        type: integer
        format: int32
        minimum: 0
        default: 0
    Size:
      name: size
      in: query
      required: false
      description: 한 쪽에 담는 주문 수. 없으면 20
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
  schemas:
    OrderItemView:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
        quantity:
          type: integer
          format: int32
    OrderDetail:
      type: object
      required: [orderNo, status, reason, shortageProductIds, missingProductIds, items, createdAt]
      properties:
        orderNo:
          type: integer
          format: int64
        status:
          type: string
          description: PENDING(처리중), CONFIRMED(확정), REJECTED(거절), FAILED(실패)
          enum: [PENDING, CONFIRMED, REJECTED, FAILED]
        reason:
          type: string
          nullable: true
          description: |
            REJECTED이면 OUT_OF_STOCK(재고 부족) 또는 PRODUCT_NOT_FOUND(상품 없음).
            FAILED이면 RETRY_LATER("잠시 후 다시 시도").
            그 밖에는 null이다. 필드는 빠지지 않는다
          enum: [OUT_OF_STOCK, PRODUCT_NOT_FOUND, RETRY_LATER]
        shortageProductIds:
          type: array
          description: 재고가 부족한 상품 ID. 상품 ID 순. 없으면 빈 배열
          items:
            type: string
        missingProductIds:
          type: array
          description: 재고 데이터에 없는 상품 ID. 상품 ID 순. 없으면 빈 배열
          items:
            type: string
        items:
          type: array
          description: 주문 항목. 상품 ID 순
          items:
            $ref: '#/components/schemas/OrderItemView'
        createdAt:
          type: string
          description: 주문 시각. 시각대가 없는 ISO 8601 글자이고, DB 서버에 저장된 값 그대로다. 예 2026-10-11T13:45:11.123456
          example: '2026-10-11T13:45:11.123456'
    AdminOrder:
      description: 고객용 OrderDetail의 모든 필드에 재고 해제 결과가 더해진 모양이다
      allOf:
        - $ref: '#/components/schemas/OrderDetail'
        - type: object
          required: [releaseStatus]
          properties:
            releaseStatus:
              type: string
              nullable: true
              description: |
                재고 해제 결과. NOT_REQUIRED(해제 불필요), RELEASED(해제 완료), RELEASE_FAILED(해제 실패).
                해제 요청 전이거나 "실패"가 아니면 null이다. 필드는 빠지지 않는다
              enum: [NOT_REQUIRED, RELEASED, RELEASE_FAILED]
    OrderPage:
      type: object
      required: [orders, page, size, hasNext]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/OrderDetail'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        hasNext:
          type: boolean
          description: 다음 쪽이 있으면 true
    AdminOrderPage:
      type: object
      required: [orders, page, size, hasNext]
      properties:
        orders:
          type: array
          items:
            $ref: '#/components/schemas/AdminOrder'
        page:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        hasNext:
          type: boolean
          description: 다음 쪽이 있으면 true
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: urn:msa-example:problem:ORDER_NOT_FOUND
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            오류 종류. 이 파일이 쓰는 값은 UNAUTHORIZED, FORBIDDEN, ORDER_NOT_FOUND, INVALID_QUERY_PARAMETER다.
            값 목록(enum)으로 묶지 않는다. 모르는 값은 status로 판단한다
        errors:
          type: array
          description: 잘못된 쿼리 매개변수일 때 매개변수별 오류. field는 매개변수 이름이다
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
