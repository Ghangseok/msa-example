openapi: 3.0.3
info:
  title: Inventory Service Internal API
  version: 1.0.0
  description: |
    재고 서비스의 내부 API다. 주문 서비스만 부르고, 클러스터 밖에는 열지 않는다.

    - 예약과 해제는 주문 번호를 멱등 키로 쓴다. 같은 주문 번호로 여러 번 불러도 재고는 한 번만 바뀐다.
    - 업무 결과(RESERVED, REJECTED, RELEASED)는 처음 요청이든 재요청이든 언제나 200으로 돌려준다.
    - 받는 쪽은 모르는 필드를 무시한다. 필드를 지우거나 이름·타입·뜻을 바꾸지 않는다. 상태 값을 더하는 것도 깨는 변경이다.
    - 이 파일은 specs/001-place-order의 계약 초안이다. P1 단계 PR에서 저장소 루트 contracts/inventory-api.yaml로 같은 내용을 만든다.
servers:
  - url: http://inventory:8080
    description: 쿠버네티스 Service 이름으로 부른다
paths:
  /reservations/{orderNo}:
    parameters:
      - $ref: '#/components/parameters/OrderNo'
    put:
      operationId: reserve
      summary: 주문 항목 전체의 재고를 한꺼번에 예약한다
      description: |
        - 모든 항목의 재고가 충분하면 항목마다 수량을 줄이고 RESERVED를 돌려준다.
        - 하나라도 부족하거나 없는 상품이면 아무 수량도 줄이지 않고 REJECTED를 돌려준다. 사유는 없는 상품이 하나라도 있으면 PRODUCT_NOT_FOUND, 아니면 OUT_OF_STOCK이다.
        - 같은 주문 번호, 같은 내용(상품 ID 순으로 정렬한 항목 목록)으로 다시 부르면 저장된 첫 결과를 그대로 돌려준다.
        - 같은 주문 번호에 다른 내용이 오면 409를 돌려준다.
        - 해제 표식이 있는 주문 번호로 부르면 반영하지 않고 RELEASED를 돌려준다.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReserveRequest'
      responses:
        '200':
          description: 업무 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReservationResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: 같은 주문 번호에 다른 내용 (code = RESERVATION_CONFLICT)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: release
      summary: 예약을 해제해 줄였던 재고를 되돌린다
      description: |
        - 예약됨이면 수량을 되돌리고 RELEASED를 돌려준다.
        - 예약 기록이 없으면 해제 표식만 남기고 RELEASED를 돌려준다.
        - 이미 해제됐으면 RELEASED, 거절된 예약이면 REJECTED를 그대로 돌려준다. 어느 경우든 수량은 한 번만 되돌린다.
      responses:
        '200':
          description: 해제 결과
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  parameters:
    OrderNo:
      name: orderNo
      in: path
      required: true
      description: 주문 서비스가 붙인 주문 번호. 예약의 멱등 키다
      schema:
        type: integer
        format: int64
        minimum: 1
  responses:
    BadRequest:
      description: 요청 형식이 잘못됨 (code = INVALID_REQUEST)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: 교착 등 예상하지 못한 오류 (code = INTERNAL_ERROR). 주문 서비스는 이 응답에 재시도하지 않는다
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    ReserveRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 예약할 항목. 같은 상품은 한 줄에만 나온다(서버가 검사한다)
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/ReservationItem'
    ReservationItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          pattern: '^[A-Z0-9-]{1,20}$'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
    ReservationResult:
      type: object
      required: [orderNo, status, shortageProductIds, missingProductIds]
      properties:
        orderNo:
          type: integer
          format: int64
        status:
          type: string
          enum: [RESERVED, REJECTED, RELEASED]
        reason:
          type: string
          nullable: true
          description: REJECTED일 때만 값이 있다
          enum: [OUT_OF_STOCK, PRODUCT_NOT_FOUND]
        shortageProductIds:
          type: array
          description: 재고가 부족한 상품 ID. 상품 ID 순. 없으면 빈 배열
          items:
            type: string
        missingProductIds:
          type: array
          description: 재고 데이터에 없는 상품 ID. 상품 ID 순. 없으면 빈 배열
          items:
            type: string
    ReleaseResult:
      type: object
      required: [orderNo, status]
      properties:
        orderNo:
          type: integer
          format: int64
        status:
          type: string
          description: 해제 뒤의 예약 상태. 거절된 예약은 REJECTED 그대로다
          enum: [RELEASED, REJECTED]
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: urn:msa-example:problem:RESERVATION_CONFLICT
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            오류 종류. 지금 쓰는 값은 INVALID_REQUEST, RESERVATION_CONFLICT, INTERNAL_ERROR다.
            나중에 값을 더해도 계약이 깨지지 않도록 enum으로 묶지 않는다. 모르는 값은 status로 판단한다
        errors:
          type: array
          description: 형식 오류일 때 필드별 오류
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
