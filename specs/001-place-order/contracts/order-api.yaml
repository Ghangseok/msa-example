openapi: 3.0.3
info:
  title: Order Service API (주문 생성)
  version: 1.0.0
  description: |
    고객이 부르는 주문 서비스의 외부 API 가운데 주문 생성 부분이다. 주문 조회는 티켓 002에서 더한다.

    - 로그인한 사용자만 부른다. 주문 서비스가 JWT를 직접 검증하고, 고객은 토큰의 sub로만 구별한다.
    - Idempotency-Key 헤더가 반드시 있어야 한다. 같은 고객이 같은 키로 다시 보내면 새 주문을 만들지 않고 지금 상태를 돌려준다.
    - 새로 기록한 주문은 결과(확정, 거절, 실패)와 관계없이 201이다. 결과는 본문의 status와 reason으로 알린다.
    - 이 파일은 서비스 사이 API가 아니라서 저장소 루트 contracts/에 두지 않는다.
servers:
  - url: http://localhost
    description: 로컬 Gateway (티켓 003). 서비스 통합 테스트는 앱을 직접 부른다
paths:
  /orders:
    post:
      operationId: placeOrder
      summary: 주문을 요청한다
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 고객 앱이 주문 시도마다 만드는 UUID 문자열(36자). 없거나 형식이 틀리면 400
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaceOrderRequest'
      responses:
        '201':
          description: 새 주문을 기록했다. 결과는 status에 있다
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '200':
          description: 같은 고객이 같은 키로 다시 보냈다. 이미 있는 주문의 지금 상태다(처리중이면 PENDING)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '400':
          description: 요청 키가 없거나 UUID가 아님(code = INVALID_IDEMPOTENCY_KEY), 또는 주문 항목이 잘못됨(code = INVALID_ORDER_ITEMS). 주문은 기록되지 않는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '401':
          description: 토큰이 없거나 검증에 실패함(code = UNAUTHORIZED). 주문은 기록되지 않는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        '422':
          description: 같은 요청 키에 다른 내용(code = IDEMPOTENCY_KEY_CONFLICT). 새 주문을 만들지 않는다
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    PlaceOrderRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          description: 주문 항목. 1개 이상 20개 이하. 같은 상품은 한 줄에만 나온다(서버가 검사한다)
          minItems: 1
          maxItems: 20
          items:
            $ref: '#/components/schemas/OrderItem'
    OrderItem:
      type: object
      required: [productId, quantity]
      properties:
        productId:
          type: string
          pattern: '^[A-Z0-9-]{1,20}$'
        quantity:
          type: integer
          format: int32
          minimum: 1
          maximum: 99
    OrderResponse:
      type: object
      required: [orderNo, status, shortageProductIds, missingProductIds]
      properties:
        orderNo:
          type: integer
          format: int64
        status:
          type: string
          description: PENDING(처리중), CONFIRMED(확정), REJECTED(거절), FAILED(실패)
          enum: [PENDING, CONFIRMED, REJECTED, FAILED]
        reason:
          type: string
          nullable: true
          description: |
            REJECTED이면 OUT_OF_STOCK(재고 부족) 또는 PRODUCT_NOT_FOUND(상품 없음).
            FAILED이면 RETRY_LATER("잠시 후 다시 시도". 다시 주문하려면 새 요청 키를 쓴다).
            그 밖에는 비어 있다
          enum: [OUT_OF_STOCK, PRODUCT_NOT_FOUND, RETRY_LATER]
        shortageProductIds:
          type: array
          description: 재고가 부족한 상품 ID. 상품 ID 순. 없으면 빈 배열
          items:
            type: string
        missingProductIds:
          type: array
          description: 재고 데이터에 없는 상품 ID. 상품 ID 순. 없으면 빈 배열
          items:
            type: string
    Problem:
      type: object
      description: RFC 9457 Problem Details
      required: [type, title, status, code]
      properties:
        type:
          type: string
          example: urn:msa-example:problem:IDEMPOTENCY_KEY_CONFLICT
        title:
          type: string
        status:
          type: integer
          format: int32
        detail:
          type: string
        instance:
          type: string
        code:
          type: string
          description: |
            오류 종류. 지금 쓰는 값은 INVALID_IDEMPOTENCY_KEY, INVALID_ORDER_ITEMS, UNAUTHORIZED, IDEMPOTENCY_KEY_CONFLICT다.
            티켓 002에서 조회 오류 값을 더할 수 있도록 enum으로 묶지 않는다. 모르는 값은 status로 판단한다
        errors:
          type: array
          description: 형식 오류일 때 필드별 오류
          items:
            $ref: '#/components/schemas/FieldError'
    FieldError:
      type: object
      required: [field, message]
      properties:
        field:
          type: string
        message:
          type: string
