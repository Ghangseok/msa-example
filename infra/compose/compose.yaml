# 클러스터 밖에서 띄우는 상태 있는 인프라: 서비스마다 Oracle 21c XE 하나, Keycloak, 관측 도구 lgtm.
#
# 보통은 tools/infra-up.ps1이 띄운다. 직접 다룰 때는 저장소 루트에서 실행한다.
#   docker compose --env-file .env -f infra/compose/compose.yaml ps
# 비밀번호는 루트 .env에서 받는다(.env.example 참고). 값이 비어 있으면 compose가 멈춘다.
#
# 컨테이너는 kind 클러스터의 Docker 네트워크(kind)에 붙는다. 그래서 Pod가 order-db:1521처럼 이름으로 찾는다.
# kind 네트워크는 kind 클러스터를 처음 만들 때 생기므로, 클러스터를 먼저 만든다.
# 호스트 포트는 이 PC(127.0.0.1)에서만 받는다.
name: msa

services:
  order-db:
    image: gvenzl/oracle-xe:21.3.0-slim-faststart
    container_name: order-db
    environment:
      # SYS, SYSTEM 비밀번호. DB를 처음 만들 때만 쓰인다.
      ORACLE_PASSWORD: ${ORDER_DB_ADMIN_PASSWORD:?.env에 ORDER_DB_ADMIN_PASSWORD 값을 채운다}
      # 기본 PDB(XEPDB1) 안에 만드는 서비스 계정. DB를 처음 만들 때만 만든다.
      APP_USER: ORDER_SVC
      APP_USER_PASSWORD: ${ORDER_SVC_PASSWORD:?.env에 ORDER_SVC_PASSWORD 값을 채운다}
    ports:
      - "127.0.0.1:1521:1521"
    volumes:
      - order-db-data:/opt/oracle/oradata
      # DB를 처음 만들 때 실행할 SQL (리스너 등록 주소 고정. 파일 안의 설명 참고)
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    networks: [kind]

  inventory-db:
    image: gvenzl/oracle-xe:21.3.0-slim-faststart
    container_name: inventory-db
    environment:
      ORACLE_PASSWORD: ${INVENTORY_DB_ADMIN_PASSWORD:?.env에 INVENTORY_DB_ADMIN_PASSWORD 값을 채운다}
      APP_USER: INVENTORY_SVC
      APP_USER_PASSWORD: ${INVENTORY_SVC_PASSWORD:?.env에 INVENTORY_SVC_PASSWORD 값을 채운다}
    ports:
      # 컨테이너 안은 1521, 호스트는 1522
      - "127.0.0.1:1522:1521"
    volumes:
      - inventory-db-data:/opt/oracle/oradata
      - ./oracle-init:/container-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 30
    networks: [kind]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.0
    container_name: keycloak
    # 개발 모드. 시작할 때 /opt/keycloak/data/import의 realm 파일을 가져온다(realm이 이미 있으면 건너뛴다).
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?.env에 KEYCLOAK_ADMIN_PASSWORD 값을 채운다}
      # 토큰 발급자(iss)를 http://localhost:8180/realms/msa 하나로 고정한다.
      # Pod가 keycloak:8080으로 토큰이나 서명 키를 받아도 iss는 같다(design 7절).
      KC_HOSTNAME: http://localhost:8180
      # 토큰·키 엔드포인트(백채널)는 요청한 주소를 그대로 쓴다. Pod는 keycloak:8080으로 부른다.
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      # realm 파일의 ${C1_PASSWORD} 같은 자리표시자를 이 값으로 바꾼다.
      C1_PASSWORD: ${C1_PASSWORD:?.env에 C1_PASSWORD 값을 채운다}
      C2_PASSWORD: ${C2_PASSWORD:?.env에 C2_PASSWORD 값을 채운다}
      M1_PASSWORD: ${M1_PASSWORD:?.env에 M1_PASSWORD 값을 채운다}
    ports:
      # 컨테이너 안은 8080, 호스트는 8180
      - "127.0.0.1:8180:8080"
    volumes:
      - ../keycloak/realm-msa.json:/opt/keycloak/data/import/realm-msa.json:ro
    networks: [kind]

  lgtm:
    # OpenTelemetry Collector, Tempo, Loki, Prometheus, Grafana가 든 개발용 이미지 (design 10절)
    image: grafana/otel-lgtm:0.35.0
    container_name: lgtm
    ports:
      - "127.0.0.1:3000:3000"   # Grafana
      - "127.0.0.1:4317:4317"   # OTLP gRPC
      - "127.0.0.1:4318:4318"   # OTLP HTTP
    networks: [kind]

volumes:
  # 이름을 고정해서 compose 프로젝트 이름이 앞에 붙지 않게 한다.
  # kind 클러스터를 지우거나 컨테이너를 다시 만들어도 남는다. 지우려면 tools/infra-down.ps1 -RemoveData
  order-db-data:
    name: order-db-data
  inventory-db-data:
    name: inventory-db-data

networks:
  kind:
    external: true
