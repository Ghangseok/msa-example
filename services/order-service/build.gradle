plugins {
    id 'msa.java-service'
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
    implementation 'org.springframework.boot:spring-boot-starter-restclient'
    implementation 'org.flywaydb:flyway-database-oracle'
    implementation 'com.oracle.database.jdbc:ojdbc17'
    implementation libs.mybatis.spring.boot.starter
    implementation libs.opentelemetry.logback.appender
    implementation libs.resilience4j.circuitbreaker
    implementation libs.resilience4j.retry

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
    testImplementation 'org.springframework.boot:spring-boot-testcontainers'
    testImplementation 'org.testcontainers:testcontainers-oracle-xe'
    testImplementation libs.mybatis.spring.boot.starter.test
    testImplementation libs.archunit.junit5
    testImplementation libs.wiremock.standalone
    testImplementation libs.swagger.request.validator.core
    testImplementation project(':libs:archunit-rules')
}
