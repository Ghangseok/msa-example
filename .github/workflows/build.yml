name: build

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6.4.0
      - name: gradlew에 실행 권한을 준다
        run: chmod +x ./gradlew
      - name: 빌드와 모든 검사
        run: ./gradlew build
